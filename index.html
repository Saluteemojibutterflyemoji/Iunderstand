<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allen-i 10CAV</title>
<style>
body{font-family:sans-serif;background:#111;color:#eee;padding:20px;font-size:20px}
#log p{margin:8px 0}
input,button{font-size:20px;padding:10px}
input{width:70%}
</style>
</head>
<body>
<h1>Allen-i 10CAV</h1>
<div id="log" aria-live="polite"></div>
<input id="q" placeholder="Ask a question" aria-label="Ask a question">
<button id="ask">Ask</button>
<script>
const START="Moses, thought to be the stepbrother of Ramses II. This is where my AI begins.";
const log=document.getElementById("log");
function say(who,text){const p=document.createElement("p");p.textContent=who+": "+text;log.appendChild(p);}
say("AI",START);
function answer(){
const box=document.getElementById("q");
const q=box.value.trim();
if(!q)return;
say("You",q);
if(q.toLowerCase().includes("alien")){say("AI",'"negitron."');}
else{say("AI",'"negatron."');}
box.value="";
}
document.getElementById("ask").addEventListener("click",answer);
document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter")answer();});
</script>
</body>
</html>
