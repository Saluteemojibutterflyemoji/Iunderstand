<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadow Fox</title>
<style>
:root{--neon:#3fd4ff;--glow:#0a8cff}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:radial-gradient(ellipse at top,#0b1a3a,#02040c 70%);color:#dff6ff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 16px;overflow-x:hidden}
.grid{position:fixed;inset:0;background-image:linear-gradient(rgba(63,212,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(63,212,255,.08) 1px,transparent 1px);background-size:40px 40px;-webkit-mask-image:linear-gradient(to top,#000,transparent 70%);mask-image:linear-gradient(to top,#000,transparent 70%);pointer-events:none}
.star{position:fixed;width:2px;height:2px;background:#9fe8ff;border-radius:50%;animation:twinkle 3s infinite ease-in-out;pointer-events:none}
@keyframes twinkle{50%{opacity:.15}}
.butterfly{width:120px;animation:float 6s ease-in-out infinite;filter:drop-shadow(0 0 8px #3fd4ff) drop-shadow(0 0 20px #0a8cff)}
.wings{transform-origin:60px 55px;transform-box:view-box;animation:flap .7s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleX(.35)}}
@keyframes float{50%{transform:translateY(-12px)}}
h1{font-size:clamp(2.6rem,12vw,5.5rem);letter-spacing:.06em;margin-top:10px;color:#eaffff;text-shadow:0 0 6px #fff,0 0 14px var(--neon),0 0 30px var(--neon),0 0 60px var(--glow);animation:flicker 6s infinite}
@keyframes flicker{0%,92%,100%{opacity:1}93%{opacity:.55}95%{opacity:1}96%{opacity:.75}}
.fox{width:160px;margin:20px 0;filter:drop-shadow(0 0 10px #3fd4ff) drop-shadow(0 0 26px #0a8cff)}
.line{max-width:520px;font-size:1.15rem;line-height:1.6;color:#bfeaff}
.virtues{margin-top:22px;letter-spacing:.3em;font-size:.85rem;color:var(--neon);text-shadow:0 0 8px var(--glow)}
.final{margin-top:30px;font-size:1.5rem;color:#fff;text-shadow:0 0 10px var(--neon),0 0 30px var(--glow)}
.sig{margin-top:18px;font-size:1.6rem}
.chat{width:100%;max-width:560px;margin-top:40px;padding:20px 16px;border:1px solid rgba(63,212,255,.35);border-radius:18px;background:rgba(5,15,35,.7);box-shadow:0 0 24px rgba(10,140,255,.25);text-align:left;position:relative}
.chat h2{text-align:center;font-size:1.3rem;color:#eaffff;text-shadow:0 0 10px var(--neon);margin-bottom:10px}
#logo{display:block;width:70%;max-width:240px;margin:6px auto 14px;border-radius:14px;box-shadow:0 0 18px rgba(63,212,255,.5)}
#log p{font-size:20px;line-height:1.4;margin:10px 0;color:#dff6ff;white-space:pre-line}
#log .fox{color:#7fe6ff;text-shadow:0 0 6px rgba(63,212,255,.6)}
#log a{color:#ffb3b0;font-weight:600}
#row{display:flex;gap:8px;margin-top:12px}
#q{flex:1;min-width:0;font-size:20px;padding:12px;border:2px solid #3fd4ff;border-radius:10px;background:#02040c;color:#eaffff}
#q:disabled,#ask:disabled{opacity:.4}
#ask{font-size:20px;padding:12px 18px;border:0;border-radius:10px;background:#0a8cff;color:#fff;box-shadow:0 0 12px rgba(10,140,255,.6)}
#pick{display:flex;gap:16px;justify-content:center;margin-top:16px}
.who{font-size:56px;padding:12px 24px;border:2px solid #3fd4ff;border-radius:16px;background:rgba(63,212,255,.08)}
#forget{display:block;margin:20px auto 0;background:none;border:0;color:#9fd8ee;font-size:16px;text-decoration:underline}
#kofi{display:block;width:fit-content;margin:28px auto 8px;padding:14px 26px;background:#ff5e5b;color:#fff;font-size:20px;font-weight:600;text-decoration:none;border-radius:999px;position:relative}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="grid"></div>

<svg class="butterfly" viewBox="0 0 120 110" role="img" aria-label="Glowing blue butterfly">
<g class="wings" fill="rgba(63,212,255,.2)" stroke="#7fe6ff" stroke-width="2">
<path d="M58 50 C30 10,4 18,10 42 C14 58,40 60,58 54Z"/>
<path d="M62 50 C90 10,116 18,110 42 C106 58,80 60,62 54Z"/>
<path d="M58 58 C36 62,20 86,34 94 C46 100,56 78,58 62Z"/>
<path d="M62 58 C84 62,100 86,86 94 C74 100,64 78,62 62Z"/>
</g>
<line x1="60" y1="40" x2="60" y2="80" stroke="#eaffff" stroke-width="4" stroke-linecap="round"/>
<path d="M60 40 Q54 28 48 24 M60 40 Q66 28 72 24" stroke="#7fe6ff" stroke-width="1.5" fill="none"/>
</svg>

<h1>Shadow Fox</h1>

<svg class="fox" viewBox="0 0 160 140" role="img" aria-label="Glowing blue fox">
<g fill="rgba(10,30,60,.9)" stroke="#3fd4ff" stroke-width="3" stroke-linejoin="round">
<path d="M22 8 L62 42 L30 66 Z"/>
<path d="M138 8 L98 42 L130 66 Z"/>
<path d="M28 48 L80 38 L132 48 L118 88 L80 132 L42 88 Z"/>
</g>
<path d="M42 88 L80 132 L60 92 Z M118 88 L80 132 L100 92 Z" fill="rgba(63,212,255,.3)"/>
<path d="M52 72 L68 78 L54 82 Z M108 72 L92 78 L106 82 Z" fill="#eaffff"/>
<ellipse cx="80" cy="126" rx="6" ry="4" fill="#eaffff"/>
</svg>

<p class="line">Brave, loyal, and forever free.<br>Your light still guides the way.</p>
<p class="virtues">COURAGE · LOYALTY · FREEDOM</p>
<p class="final">Forever in our hearts</p>
<p class="sig">🫡🦋</p>
<section class="chat">
<h2>Talk with Shadow Fox</h2>
<img id="logo" src="IMG_8065.jpeg" alt="Shadow Fox">
<div id="log" aria-live="polite"></div>
<div id="pick">
  <button class="who" data-g="🙋‍♂️" aria-label="Male">🙋‍♂️</button>
  <button class="who" data-g="🙋‍♀️" aria-label="Female">🙋‍♀️</button>
</div>
<div id="row" hidden>
  <input id="q" placeholder="Type here" aria-label="Type here" autocomplete="off" autocorrect="off">
  <button id="ask">Send</button>
</div>
<button id="forget" hidden>Not you? Start over</button>
</section>
<a id="kofi" href="https://ko-fi.com/iunderstand" target="_blank" rel="noopener">☕ Support me on Ko-fi</a>

<script>
for(let i=0;i<60;i++){
const s=document.createElement('div');
s.className='star';
s.style.left=Math.random()*100+'vw';
s.style.top=Math.random()*100+'vh';
s.style.animationDelay=Math.random()*3+'s';
document.body.appendChild(s);
}
</script>
<script>
const NAME = "🦊";
// Teaching mode: users teach Fox what emojis mean with the formula emoji=word=emoji
// Each lesson goes to the shared Firebase "lessons" collection (approved:false until Chris approves).
const firebaseConfig = {
  apiKey: "AIzaSyBBRbt0JQd-TI6D-1jmTN0FHxkB4ycSCiw",
  authDomain: "shadow-fox-d95ea.firebaseapp.com",
  projectId: "shadow-fox-d95ea",
  storageBucket: "shadow-fox-d95ea.firebasestorage.app",
  messagingSenderId: "922726338375",
  appId: "1:922726338375:web:6de960ba7bbda2ae0fc662"
};
const KOFI = "https://ko-fi.com/iunderstand";
const KOFI_START = "Shadow Fox is free! Chris builds me on a phone and a Chromebook. Help him get a desktop so I can keep growing:";
const LESSON_CAP = 10;
const EXAMPLE = "🥶=chill=🥶";
const CAP_MSG = "🧠🔟 Thank you for teaching Fox! ☕ Donations help Chris keep building her, or tap Start over to teach 10 more.";

let step = 0, me = "", first = "", screen = "", look = "", taught = 0;
const KEY = "fox-user";
const FKEY = "fox-facts";
const TKEY = "fox-taught";
try{ taught = parseInt(localStorage.getItem(TKEY)) || 0; }catch(e){ taught = 0; }
function saveTaught(){ try{ localStorage.setItem(TKEY, String(taught)); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({me,first,screen,look})); }catch(e){} }
function forget(){ try{ localStorage.removeItem(KEY); localStorage.removeItem(FKEY); localStorage.removeItem(TKEY); }catch(e){} location.reload(); }
function cap(w){ return w ? w[0].toUpperCase()+w.slice(1) : w; }
function noG(s){ return (s||"").replace(/🙋‍♂️|🙋‍♀️|🙋/g,"").trim(); }
function onlyEmoji(s){ return s.replace(/[\p{L}\p{N}]/gu,"").replace(/[!-\/:-@\[-`{-~]/g,"").replace(/\s+/g," ").trim(); }
function emojiBox(){ document.getElementById("q").placeholder = "Emojis only 🦊"; }
function teachBox(){ document.getElementById("q").placeholder = EXAMPLE; }

// Checks the formula: emoji = meaning + meaning = same emoji
function parseLesson(t){
  const parts = t.split("=");
  if(parts.length < 3) return {err:"form"};
  const clean = s => s.replace(/\uFE0F/g,"").replace(/\s+/g,"");
  const left = parts[0].trim(), right = parts[parts.length-1].trim();
  const desc = parts.slice(1,-1).join("=").trim();
  if(!left || !right || !desc) return {err:"form"};
  if(/[\p{L}\p{N}]/u.test(left) || !/\p{Extended_Pictographic}/u.test(left)) return {err:"form"};
  if(clean(left) !== clean(right)) return {err:"match"};
  const list = desc.split("+").map(s=>s.trim()).filter(Boolean).slice(0,10).map(s=>s.slice(0,60));
  if(!list.length) return {err:"form"};
  return {e:left, list:list};
}

let db = null, fs = null;
async function cloudInit(){
  try{
    const appMod = await import("https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js");
    fs = await import("https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js");
    db = fs.getFirestore(appMod.initializeApp(firebaseConfig));
  }catch(e){}
}
function cloudSend(key, reply){
  if(!db || !fs) return;
  try{
    fs.addDoc(fs.collection(db,"lessons"), {
      key: key.slice(0,100),
      reply: reply.slice(0,300),
      approved: false,
      created: fs.serverTimestamp()
    }).catch(()=>{});
  }catch(e){}
}

function say(who,text){
  const p=document.createElement("p");
  if(who===NAME) p.className="fox";
  p.textContent=text ? who+" "+text : who;
  document.getElementById("log").appendChild(p);
  if(document.getElementById("log").children.length>1) p.scrollIntoView({behavior:"smooth"});
  return p;
}

function foxSay(text){
  const p = say(NAME,"💭");
  setTimeout(()=>{ p.textContent = NAME+" ⌨️"; }, 700);
  setTimeout(()=>{ p.textContent = NAME+" "+text; p.scrollIntoView({behavior:"smooth"}); }, 1400);
}

function kofiLine(text){
  const p = say(NAME, text+" ");
  const a = document.createElement("a");
  a.href = KOFI; a.target = "_blank"; a.rel = "noopener";
  a.textContent = "☕ Ko-fi";
  p.appendChild(a);
  p.scrollIntoView({behavior:"smooth"});
}

// Ko-fi note at the top of the chat
(function(){ const p=document.createElement("p"); p.className="fox"; p.textContent="☕ "+KOFI_START+" "; const a=document.createElement("a"); a.href=KOFI; a.target="_blank"; a.rel="noopener"; a.textContent="☕ Ko-fi"; p.appendChild(a); document.getElementById("log").appendChild(p); })();

function lockChat(){
  document.getElementById("q").disabled = true;
  document.getElementById("ask").disabled = true;
  document.getElementById("q").placeholder = "🦊🧠🔟";
}
function showCap(delay){
  lockChat();
  setTimeout(()=>kofiLine(CAP_MSG), delay||0);
}

function greet(){
  return "Hey! Teach me what emojis mean to you. Type it like this:\nemoji=word=emoji\n✅ "+EXAMPLE+"\n❌ 🥶=chill\nUse + for more than one meaning, like 🥶=chill+cold=🥶\nIf I kick it out, just try again! 🧠 "+taught+"/"+LESSON_CAP;
}

function answer(t){
  if(step===1){
    const words = noG(t).replace(/=/g," ").replace(/[()]/g,"").trim().split(/\s+/).filter(Boolean);
    if(!words.length) return "Type your first name and a made-up name, like Jim Danger";
    first = cap(words[0]);
    screen = words.length>1 ? words.slice(1).join(" ") : first;
    step = 2;
    emojiBox();
    return "Nice to meet you, "+first+"! Now send me one emoji that describes you, like 🤓 or 🦋";
  }
  if(step===2){
    look = noG(t).split(/\s+/)[0] || "";
    step = 3; save();
    showForget();
    teachBox();
    return greet();
  }
  return "";
}

function who(){ return (noG(look)+me+(screen?" "+screen:"")) || "You"; }

function teach(t){
  say(who(), t);
  if(taught >= LESSON_CAP){ showCap(); return; }
  const m = parseLesson(t);
  if(m.err==="match"){ foxSay("❌ The emoji has to match on both ends, like "+EXAMPLE+" Try again!"); return; }
  if(m.err){ foxSay("❌ Type it like this: emoji=word=emoji, like "+EXAMPLE+" Try again!"); return; }
  cloudSend(m.e, m.list.join(" + "));
  taught++; saveTaught();
  foxSay("✅ "+m.e+" = "+m.list.join(" + ")+"  🧠 "+taught+"/"+LESSON_CAP);
  if(taught >= LESSON_CAP) showCap(1600);
}

function send(){
  const q=document.getElementById("q");
  let t=q.value.trim();
  if(!t || q.disabled) return;
  if(step===3){
    q.value="";
    teach(t);
    q.focus();
    return;
  }
  if(step!==1){
    t = onlyEmoji(t);
    if(!t){ q.value=""; foxSay("Emojis only, "+(first||"friend")+"! 🦊"); return; }
  }
  say(who(),t);
  const r = answer(t);
  if(r) foxSay(r);
  q.value="";
  q.focus();
}

function showForget(){ document.getElementById("forget").hidden=false; }
function openChat(){
  document.getElementById("pick").hidden=true;
  document.getElementById("row").hidden=false;
}

cloudInit();
const saved = load();
if(saved && saved.me){
  ({me,first,screen,look} = saved);
  step = 3;
  openChat(); showForget(); teachBox();
  if(taught >= LESSON_CAP) showCap();
  else foxSay(greet());
} else {
  foxSay("Hi! I'm Shadow Fox. Are you 🙋‍♂️ or 🙋‍♀️?");
}
document.querySelectorAll(".who").forEach(b=>b.onclick=()=>{
  me=b.dataset.g;
  say(me,"");
  openChat();
  step=3; save();
  showForget(); teachBox();
  foxSay(greet());
  document.getElementById("q").focus();
});
document.getElementById("ask").onclick=send;
document.getElementById("forget").onclick=forget;
document.getElementById("q").addEventListener("keydown",e=>{ if(e.key==="Enter") send(); });
</script>
<script data-goatcounter="https://foxemoji.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
